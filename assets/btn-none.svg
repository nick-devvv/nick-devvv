<svg xmlns="http://www.w3.org/2000/svg" width="800" height="112" viewBox="0 0 800 112" shape-rendering="crispEdges"><title></title><style>.tw{animation:tw 2.4s steps(1) infinite}@keyframes tw{0%,100%{opacity:1}40%{opacity:.2}70%{opacity:.7}}.st0{animation-delay:0s}.st1{animation-delay:-.6s}.st2{animation-delay:-1.2s}.st3{animation-delay:-1.8s}.bob{animation:bob 1.4s ease-in-out infinite}.bob2{animation:bob 1.4s ease-in-out infinite;animation-delay:-.7s}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 1.8s ease-in-out infinite}@keyframes spin{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.08)}}.blink{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}.shine{animation:shine 4.5s linear infinite}@keyframes shine{0%{transform:skewX(-20deg) translateX(-500px)}45%,100%{transform:skewX(-20deg) translateX(2200px)}}.glow{animation:glow 6s ease-in-out infinite}@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}.nudge{animation:nudge 1s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}</style><path fill="#0E1512" d="M16 0h768v8h8v8h8v80h-8v8h-8v8h-768v-8h-8v-8h-8v-80h8v-8h8z"/><path fill="#141D19" d="M20 4h760v8h8v8h8v68h-8v8h-8v8h-760v-8h-8v-8h-8v-68h8v-8h8z"/><path fill="#0F1714" d="M12 90h776v8h-776z"/></svg>
